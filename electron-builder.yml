appId: com.aortegablasi.stock-portfolio-viewer
productName: Stock Portfolio Viewer
copyright: Copyright © 2026 Andreu Ortega Blasi

directories:
  output: release
  buildResources: build

# electron-vite emits the compiled app into out/; ship that plus the manifest.
files:
  - out/**
  - package.json

# Ship the generated SQL migrations so they can run on first launch of the
# packaged app (resolved via process.resourcesPath in src/db/migrate.ts).
extraResources:
  - from: drizzle
    to: drizzle

# Single-user, local-first app targeting the owner's Windows machine.
win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
