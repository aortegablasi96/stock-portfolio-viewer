<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Lock the renderer down: no remote content beyond basemap tiles, inline styles only.

      `connect-src` allows exactly ONE external origin, api.mapbox.com, for the Allocation
      map's basemap tiles (ADR-0007). `blob:` is required because Mapbox GL JS compiles its
      worker from a blob URL.

      events.mapbox.com is DELIBERATELY ABSENT. Mapbox GL JS posts usage telemetry there by
      default; omitting the origin makes the browser block it regardless of library version or
      configuration, which is what structurally guarantees that no portfolio data leaves the
      RENDERER. This is not an oversight -- do not add it.

      Scope note (ADR-0010, amended by ADR-0011): this CSP is the renderer's boundary, not the
      application's. The AI assistant sends portfolio-derived figures to OpenAI from the MAIN
      process whenever a key is present and a question is asked, and main is not subject to this
      policy. Do not add an origin here for it
      -- the renderer must stay unable to reach a model provider, which is what keeps the API
      key out of this bundle.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src blob:; child-src blob:; connect-src 'self' https://api.mapbox.com"
    />
    <title>Stock Portfolio Viewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
